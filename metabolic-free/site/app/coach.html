<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Roster · Metabolic Free</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .wrap { max-width:960px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.05em; }
  .scroll { overflow-x:auto; }
  .flag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; margin:2px 4px 2px 0; }
  .risk { background:#3a1616; color:#ff9b9b; }
  .renew { background:#2a2410; color:#f7d58b; }
  .ok { background:#12301f; color:#8fe3b5; }
  .banner { background:#2a2410; border:1px solid #f5a524; color:#f7d58b; border-radius:10px; padding:10px 14px; font-size:14px; margin-top:12px; }
</style>
<script src="../config.js"></script>
<script src="program.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js"></script>
</head>
<body>
<nav class="topnav" aria-label="Main"><div class="wrap">
  <a class="brand" href="../index.html">Metabolic <span>Free</span></a>
  <a class="tab" href="coach.html" aria-current="page">Roster</a>
</div></nav>
<main class="wrap" id="root"></main>
<script>
const S = window.MF_STORE, { iso, daysAgo } = window.MF_UTIL, esc = MF.esc;
const root = document.getElementById("root");

(async () => {
  if (!(await S.session())) { location.href = "index.html"; return; }
  const rows = await S.roster();
  const today = iso(new Date()), riskDay = iso(daysAgo(5));
  const fmt = (t) => t ? new Date(t).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "not set";
  const enriched = rows.map((r) => {
    const day = r.start_date ? Math.floor((Date.now() - new Date(r.start_date + "T00:00:00")) / 864e5) : 0;
    const flags = [];
    if (!r.last_checkin || r.last_checkin < riskDay) flags.push(["risk", "No check-in 5+ days"]);
    if (r.adherence7 < 50) flags.push(["risk", "Low adherence"]);
    if (day >= 35 && day <= 49) flags.push(["renew", "Week 6: offer $199 renewal"]);
    if (!flags.length) flags.push(["ok", "On track"]);
    return { ...r, week: Math.floor(day / 7) + 1, flags, score: flags[0][0] === "risk" ? 0 : flags[0][0] === "renew" ? 1 : 2 };
  }).sort((a, b) => a.score - b.score);
  const spotsLeft = Math.max(0, MF_CONFIG.FOUNDING_SPOTS - rows.length);
  root.innerHTML = `
    ${S.mode === "demo" ? `<div class="banner">Demo mode: sample clients. Connect Supabase in config.js to see real clients.</div>` : ""}
    <header class="hero" style="padding-bottom:8px"><div class="eyebrow">Coach roster</div>
      <h1 style="font-size:32px">${rows.length} active clients</h1>
      <p class="sub" style="font-size:16px">${spotsLeft} of ${MF_CONFIG.FOUNDING_SPOTS} founding spots left · clients who need you most are at the top.</p></header>
    <div class="scroll"><table>
      <thead><tr><th>Client</th><th>Week</th><th>Last check-in</th><th>7-day check-ins</th><th>Next session</th><th>Status</th></tr></thead>
      <tbody>${enriched.map((r) => `<tr>
        <td><b>${esc(r.first_name || "—")}</b></td><td>${r.week}</td>
        <td>${r.last_checkin === today ? "Today" : esc(r.last_checkin || "never")}</td>
        <td>${r.adherence7}%</td><td>${esc(fmt(r.next_session))}</td>
        <td>${r.flags.map(([c, t]) => `<span class="flag ${c}">${esc(t)}</span>`).join("")}</td></tr>`).join("")}</tbody>
    </table></div>`;
})();
</script>
</body>
</html>
