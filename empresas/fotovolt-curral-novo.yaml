    RESOLVIDO pelos relatórios mensais da Bro (jan-out/2026):
    a usina gera créditos de energia alocados a UCs de consumidores terceiros.
    A Bro (vendedora/gestora) fatura os clientes a uma tarifa com desconto sobre a CEMIG,
    cobra, retém 10% de administração sobre o VALOR PAGO, deduz a fatura da concessionária
    e repassa o líquido. Não há locação: há venda de energia compensada via consórcio.
